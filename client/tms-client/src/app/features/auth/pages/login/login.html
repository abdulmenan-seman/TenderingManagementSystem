<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-brand-bg/40">
  <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl border border-teal-100 shadow-xl shadow-teal-900/5">
    
    <!-- Header -->
    <div class="text-center">
      <div class="inline-flex w-12 h-12 rounded-xl bg-brand-green/10 text-brand-green items-center justify-center mb-3">
        <mat-icon>lock</mat-icon>
      </div>
      <h2 class="text-3xl font-extrabold text-brand-navy tracking-tight">Sign in to ProcureX</h2>
      <p class="mt-2 text-sm text-brand-muted">
        Access your portal or supplier dashboard
      </p>
    </div>

    <!-- Error Callout -->
    @if (errorMessage) {
      <div class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2.5">
        <mat-icon class="!text-red-600 !w-5 !h-5 !text-lg">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        
        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-brand-navy uppercase mb-1">Email Address</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput type="email" formControlName="email" placeholder="name@company.com">
            <mat-icon matSuffix class="!text-brand-muted">mail_outline</mat-icon>
          </mat-form-field>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-brand-navy uppercase mb-1">Password</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
              <mat-icon class="!text-brand-muted">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>
        </div>

      </div>

      <!-- Submit Button -->
      <button 
        mat-flat-button 
        type="submit" 
        [disabled]="loginForm.invalid || isLoading"
        class="w-full !bg-brand-green hover:!bg-emerald-700 !text-white !py-6 !rounded-xl font-semibold shadow-md shadow-emerald-600/20">
        <span>{{ isLoading ? 'Authenticating...' : 'Sign In' }}</span>
      </button>

      <!-- Redirect to Register Page -->
      <div class="text-center pt-2">
        <p class="text-sm text-brand-muted">
          New Supplier? 
          <a routerLink="/auth/register" class="text-brand-blue font-semibold hover:underline ml-1">
            Register Company
          </a>
        </p>
      </div>

    </form>

  </div>
</div>
