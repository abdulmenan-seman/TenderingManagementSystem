<div class="flex h-screen bg-slate-100 font-sans text-slate-800 overflow-hidden">

  <!-- Mobile Backdrop Overlay -->
  @if (isMobileOpen()) {
    <div 
      (click)="toggleMobileSidebar()" 
      class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm lg:hidden transition-opacity">
    </div>
  }

  <!-- Sidebar Component -->
  <aside 
    [ngClass]="{
      'translate-x-0': isMobileOpen(),
      '-translate-x-full lg:translate-x-0': !isMobileOpen(),
      'w-64': !isCollapsed(),
      'w-20': isCollapsed()
    }"
    class="fixed lg:static inset-y-0 left-0 z-50 flex flex-col bg-[#0f172a] text-slate-300 transition-all duration-300 ease-in-out shadow-2xl shrink-0">
    
    <!-- Sidebar Header Brand -->
    <div class="flex items-center justify-between h-16 px-4 bg-[#1e293b]/60 border-b border-slate-800">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="flex items-center justify-center p-2 rounded-xl bg-blue-600 text-white shrink-0 shadow-lg shadow-blue-500/30">
          <mat-icon class="!w-6 !h-6 !text-2xl">gavel</mat-icon>
        </div>
        @if (!isCollapsed()) {
          <span class="font-bold text-lg text-white tracking-wide truncate">TMS Portal</span>
        }
      </div>

      <!-- Collapse Desktop Button -->
      <button 
        (click)="toggleSidebar()" 
        mat-icon-button 
        class="hidden lg:flex text-slate-400 hover:text-white transition-colors">
        <mat-icon>{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <!-- Navigation List with Active Router Links -->
    <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.label) {
        <a 
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600 text-white shadow-md shadow-blue-600/30 font-semibold"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard/admin' }"
          [matTooltip]="isCollapsed() ? item.label : ''"
          matTooltipPosition="right"
          [ngClass]="{
            'justify-center px-0': isCollapsed(),
            'px-4': !isCollapsed()
          }"
          class="flex items-center gap-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/80 hover:text-slate-100 transition-all duration-200 group cursor-pointer">
          <mat-icon class="shrink-0 transition-transform duration-200 group-hover:scale-110">{{ item.icon }}</mat-icon>
          @if (!isCollapsed()) {
            <span class="text-sm tracking-wide truncate">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-slate-800/80">
      <button 
        (click)="logout()" 
        [matTooltip]="isCollapsed() ? 'Sign Out' : ''"
        matTooltipPosition="right"
        [ngClass]="{ 'justify-center px-0': isCollapsed(), 'px-4': !isCollapsed() }"
        class="w-full flex items-center gap-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-all duration-200">
        <mat-icon class="shrink-0">logout</mat-icon>
        @if (!isCollapsed()) {
          <span class="text-sm font-medium truncate">Sign Out</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Viewport Container -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- Top Action Header -->
    <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 flex items-center justify-between z-30 sticky top-0">
      
      <div class="flex items-center gap-4">
        <!-- Mobile Menu Toggle Button -->
        <button 
          (click)="toggleMobileSidebar()" 
          mat-icon-button 
          class="lg:hidden text-slate-600 hover:text-slate-900">
          <mat-icon>menu</mat-icon>
        </button>

        <!-- Page Header Title -->
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Dashboard</h1>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tendering Management System</p>
        </div>
      </div>

      <!-- Right Header Controls -->
      <div class="flex items-center gap-3">
        
        <!-- Notifications Button -->
        <button mat-button class="!rounded-xl !px-3.5 !py-2 !text-slate-600 hover:!bg-slate-100">
          <mat-icon class="text-slate-500 mr-1.5">notifications</mat-icon>
          <span class="hidden sm:inline font-medium text-slate-700">Notifications</span>
        </button>

        <!-- Settings Button -->
        <button mat-button class="!rounded-xl !px-3.5 !py-2 !text-slate-600 hover:!bg-slate-100">
          <mat-icon class="text-slate-500 mr-1.5">settings</mat-icon>
          <span class="hidden sm:inline font-medium text-slate-700">Settings</span>
        </button>

        <!-- User Profile Dropdown -->
        <button [matMenuTriggerFor]="adminMenu" class="flex items-center gap-3 p-1.5 rounded-2xl hover:bg-slate-100 transition-all">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-base shadow-md shadow-blue-500/20">
            A
          </div>
          <mat-icon class="text-slate-400">expand_more</mat-icon>
        </button>

        <mat-menu #adminMenu="matMenu" xPosition="before" class="!rounded-2xl !py-2">
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-xs text-slate-400 font-medium">Logged in as</p>
            <p class="text-sm font-bold text-slate-800">System Administrator</p>
          </div>
          <button mat-menu-item (click)="logout()" class="!text-red-600">
            <mat-icon class="!text-red-600">logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>

      </div>
    </header>

    <!-- Dynamic Router Viewport Container -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
