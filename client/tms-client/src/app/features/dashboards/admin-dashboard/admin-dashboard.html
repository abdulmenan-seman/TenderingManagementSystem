<div class="h-screen h-[100dvh] w-screen bg-slate-100 flex font-sans text-slate-800 overflow-hidden relative">
  
  <!-- Mobile Backdrop Overlay -->
  @if (isMobileOpen()) {
    <div 
      (click)="toggleMobileSidebar()" 
      class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm lg:hidden backdrop-fade">
    </div>
  }

  <!-- Mobile & Desktop Responsive Sidebar -->
  <aside 
    [ngClass]="{
      'translate-x-0': isMobileOpen(),
      '-translate-x-full lg:translate-x-0': !isMobileOpen(),
      'w-64': !isCollapsed(),
      'w-20': isCollapsed()
    }" 
    class="fixed lg:static inset-y-0 left-0 z-50 bg-[#1b4380] text-white flex flex-col shrink-0 shadow-xl">
    
    <!-- Sidebar Toggle & Brand Header -->
    <div class="h-16 sm:h-20 flex items-center justify-between px-4 sm:px-6 border-b border-blue-900/40 shrink-0">
      <button 
        (click)="toggleSidebar()" 
        class="hidden lg:flex p-2 rounded-xl hover:bg-white/10 transition-colors text-white focus:outline-none">
        <mat-icon class="!w-7 !h-7 !text-3xl">menu</mat-icon>
      </button>

      <!-- Mobile Close Trigger -->
      <button 
        (click)="toggleMobileSidebar()" 
        class="lg:hidden p-2 rounded-xl hover:bg-white/10 transition-colors text-white focus:outline-none">
        <mat-icon class="!w-6 !h-6 sm:!w-7 sm:!h-7">close</mat-icon>
      </button>

      @if (!isCollapsed() || isMobileOpen()) {
        <span class="text-xs font-bold uppercase tracking-wider text-blue-200">TMS Portal</span>
      }
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-3 py-4 sm:py-6 space-y-1 sm:space-y-2 overflow-y-auto">
      @for (item of navItems; track item.label) {
        <a 
          [routerLink]="item.route" 
          (click)="isMobileOpen() ? toggleMobileSidebar() : null"
          routerLinkActive="bg-white/15 text-white font-semibold"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard/admin' }"
          [matTooltip]="isCollapsed() && !isMobileOpen() ? item.label : ''"
          matTooltipPosition="right"
          [ngClass]="isCollapsed() && !isMobileOpen() ? 'justify-center px-0' : 'px-4'"
          class="flex items-center gap-4 py-3 sm:py-3.5 rounded-xl text-blue-100 hover:bg-white/10 transition-all cursor-pointer group">
          <mat-icon class="shrink-0 transition-transform duration-200 group-hover:scale-110">{{ item.icon }}</mat-icon>
          @if (!isCollapsed() || isMobileOpen()) {
            <span class="text-sm font-medium tracking-wide truncate">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Sidebar Sign Out Footer -->
    <div class="p-3 border-t border-blue-900/40 shrink-0">
      <button 
        (click)="logout()" 
        [matTooltip]="isCollapsed() && !isMobileOpen() ? 'Sign Out' : ''"
        matTooltipPosition="right"
        [ngClass]="isCollapsed() && !isMobileOpen() ? 'justify-center px-0' : 'px-4'"
        class="w-full flex items-center gap-4 py-3 rounded-xl text-red-300 hover:bg-red-500/20 hover:text-white transition-all cursor-pointer">
        <mat-icon class="shrink-0">logout</mat-icon>
        @if (!isCollapsed() || isMobileOpen()) {
          <span class="text-sm font-medium truncate">Sign Out</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main View Area -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    
    <!-- Top Bar Header -->
    <header class="h-16 sm:h-20 bg-slate-100/90 backdrop-blur-md px-4 sm:px-8 flex items-center justify-between z-30 sticky top-0 border-b border-slate-200/60 shrink-0">
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Mobile Open Trigger -->
        <button 
          (click)="toggleMobileSidebar()" 
          class="lg:hidden p-1.5 sm:p-2 rounded-xl hover:bg-slate-200/60 transition-colors text-slate-700 focus:outline-none">
          <mat-icon class="!w-6 !h-6 sm:!w-7 sm:!h-7">menu</mat-icon>
        </button>

        <div>
          <h1 class="text-lg sm:text-2xl font-black text-[#1b4380] tracking-tight truncate">Admin Dashboard</h1>
          <p class="text-[10px] sm:text-xs font-medium text-slate-500 truncate">Tendering Management System</p>
        </div>
      </div>

      <!-- Header Controls -->
      <div class="flex items-center gap-1 sm:gap-4">
        <button mat-button class="!rounded-xl !px-2.5 sm:!px-3 !py-2 !text-slate-700 hover:!bg-slate-200/60 !min-w-0">
          <mat-icon class="text-slate-600 sm:mr-2">notifications</mat-icon>
          <span class="hidden md:inline font-semibold text-sm">Notifications</span>
        </button>

        <button mat-button class="!rounded-xl !px-2.5 sm:!px-3 !py-2 !text-slate-700 hover:!bg-slate-200/60 !min-w-0">
          <mat-icon class="text-slate-600 sm:mr-2">settings</mat-icon>
          <span class="hidden md:inline font-semibold text-sm">Settings</span>
        </button>

        <!-- Profile Menu Trigger -->
        <button [matMenuTriggerFor]="adminMenu" class="flex items-center gap-2 p-1 rounded-full hover:ring-4 hover:ring-slate-200 transition-all ml-1">
          <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-blue-700 text-white border-2 border-white shadow-md overflow-hidden flex items-center justify-center font-bold text-sm sm:text-lg">
            A
          </div>
        </button>

        <mat-menu #adminMenu="matMenu" xPosition="before" class="!rounded-2xl !py-2">
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-xs text-slate-400 font-medium">Logged in as</p>
            <p class="text-sm font-bold text-slate-800">System Administrator</p>
          </div>
          <button mat-menu-item (click)="logout()" class="!text-red-600">
            <mat-icon class="!text-red-600">logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <!-- Dynamic Main Workspace Container -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto max-w-7xl w-full mx-auto space-y-6 sm:space-y-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
